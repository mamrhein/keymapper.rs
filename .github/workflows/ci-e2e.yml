# ---------------------------------------------------------------------------
# name:     ci-e2e
# triggers: push to main, pull requests
#
# Runs the end-to-end sandbox tests on Linux, macOS, and Windows.  Linux
# requires root for /dev/uinput access.  macOS requires root to bypass
# TCC Accessibility permission.  Windows runs without elevation since
# SendInput and WH_KEYBOARD_LL work at session level.
# ---------------------------------------------------------------------------

name: ci-e2e

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  # -----------------------------------------------------------------------
  # Linux — e2e sandbox tests with /dev/uinput
  # -----------------------------------------------------------------------
  linux-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libudev-dev \
            libxkbcommon-dev \
            libxcb1-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Build daemon and e2e test binary
        # The e2e tests spawn keymapperd as a subprocess and resolve it from
        # target/debug/keymapperd relative to the test binary's location.
        # The daemon is built with the `e2e` feature so the test hooks
        # (readiness file, active-app override, capture mode) are compiled in.
        run: |
          cargo build --features e2e --bin keymapperd
          cargo nextest run --features e2e --test e2e_tests --no-run

      - name: Run e2e tests as root (for /dev/uinput access)
        # Running as root is required because the sandbox needs write access
        # to /dev/uinput.  GitHub Actions runners allow this with sudo.
        run: |
          # Load the uinput module — it may already be loaded but this is
          # idempotent and harmless.
          sudo modprobe uinput || true
          # The ubuntu-latest runner has /dev/uinput with root:root 0660.
          # Running tests as root grants the required write access.
          sudo -E PATH="$PATH" $(which cargo) nextest run --features e2e --no-capture --test e2e_tests

      - name: Run CLI integration tests (e2e)
        # The `keymapper_tests` that locate their config via the CWD are only
        # compiled in with the `e2e` feature, so build the CLI binary with e2e
        # and run them here. They need no input device, but they do need to be
        # run as root to acces the lock file created by the previous test.
        run: |
          cargo build --features e2e --bin keymapper
          sudo -E PATH="$PATH" $(which cargo) nextest run --features e2e --test keymapper_tests

  # -----------------------------------------------------------------------
  # macOS — e2e sandbox tests (root bypasses TCC Accessibility)
  # -----------------------------------------------------------------------
  macos-e2e:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # The Karabiner Driver Kit extension requires a one-time user approval
      # that a headless runner cannot give. So, the e2e tests cannot run in
      # this workflow.

      - name: Run CLI integration tests
        # The `keymapper_tests` that locate their config via the CWD are only
        # compiled in with the `e2e` feature, so build the CLI binary with e2e
        # and run them here. They need no input device and no root acces.
        run: |
          cargo build --features e2e --bin keymapper
          cargo nextest run --features e2e --test keymapper_tests

  # -----------------------------------------------------------------------
  # Windows — e2e sandbox tests (no elevation required)
  # -----------------------------------------------------------------------
  windows-e2e:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Build daemon and e2e test binary
        run: |
          cargo build --features e2e --bin keymapperd
          cargo nextest run --features e2e --test e2e_tests --no-run

      - name: Run e2e tests
        # SendInput and WH_KEYBOARD_LL work at session level; no elevation
        # is required.
        run: cargo nextest run --features e2e --no-capture --test e2e_tests

      - name: Run CLI integration tests (e2e)
        # The `keymapper_tests` that locate their config via the CWD are only
        # compiled in with the `e2e` feature, so build the CLI binary with e2e
        # and run them here.  They need no root access or input device.
        run: |
          cargo build --features e2e --bin keymapper
          cargo nextest run --features e2e --test keymapper_tests
