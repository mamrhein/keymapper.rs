  #         cargo build --bin keymapperd --bin keymapper_monitor --bin keymapper_testwindow
  #         cargo nextest run --test e2e_tests --no-run

  #     - name: Run e2e tests as root (for /dev/uinput access)
  #       # Running as root is required because the sandbox needs write access
  #       # to /dev/uinput.  GitHub Actions runners allow this with sudo.  A
  #       # virtual X display (Xvfb) is started for the test-window helper, which
  #       # needs a display to focus a window (no window manager is required).
  #       run: |
  #         # Load the uinput module — it may already be loaded but this is
