  #       run: |
  #         sudo apt-get update
  #         sudo apt-get install -y \
  #           pkg-config \
  #           libdbus-1-dev \
  #           libudev-dev \
  #           libxkbcommon-dev \
  #           libxcb1-dev \
  #           xvfb

  #     - name: Install cargo-nextest
  #       uses: taiki-e/install-action@nextest

  #     - name: Build daemon and e2e test binary
  #       # The e2e harness spawns keymapperd, keymapper_monitor, and
  #       # keymapper_testwindow as subprocesses and resolves each from
  #       # target/debug/ relative to the test binary's location.  The daemon is
  #       # a plain production build; the harness drives it and observes its
