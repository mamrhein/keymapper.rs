# ---------------------------------------------------------------------------
# name:     ci-e2e
# triggers: push to main, pull requests
#
# Runs the end-to-end sandbox tests on Linux, macOS, and Windows.  Linux
# requires root for /dev/uinput access.  macOS requires root to bypass
# TCC Accessibility permission.  Windows runs without elevation since
# SendInput and WH_KEYBOARD_LL work at session level.
# ---------------------------------------------------------------------------

name: ci-e2e

on:
  workflow_dispatch:
    branches:
      - main
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "src/**"
  #     - "tests/**"
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  # -----------------------------------------------------------------------
  # Linux — e2e sandbox tests with /dev/uinput
  # -----------------------------------------------------------------------
  linux-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libudev-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            kbd

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Build daemon and e2e test binary
        # The e2e harness spawns keymapperd and keymapper_reader as
        # subprocesses and resolves each from target/debug/ relative to the
        # test binary's location.  The daemon is a plain production build; the
        # harness drives it and observes its output through the reader, an
        # ordinary raw-mode stdin app with keyboard focus.
        run: |
          cargo build --bin keymapperd --bin keymapper_reader
          cargo nextest run --test e2e_tests --no-run

      - name: Run e2e tests as root (for /dev/uinput access)
        # Running as root is required because the sandbox needs write access
        # to /dev/uinput.  GitHub Actions runners allow this with sudo.  The
        # console keymap is pinned to US so the reader's recorded bytes are
        # deterministic; the harness itself stops getty@tty1 and switches to
        # VT1 so the reader receives the daemon's uinput output.
        run: |
          # Load the uinput module — it may already be loaded but this is
          # idempotent and harmless.
          sudo modprobe uinput || true
          # Pin the console keymap to US for deterministic byte comparison.
          sudo loadkeys us
          # The ubuntu-latest runner has /dev/uinput with root:root 0660.
          # Running tests as root grants the required write access.
          sudo -E PATH="$PATH" $(which cargo) nextest run --no-capture --test e2e_tests

      - name: Run CLI integration tests
        # The CLI integration tests need no input device, but they do need to
        # be run as root to access the lock file created by the previous test.
        run: |
          cargo build --bin keymapper
          sudo -E PATH="$PATH" $(which cargo) nextest run --test keymapper_tests

  # -----------------------------------------------------------------------
  # macOS — e2e sandbox tests (root bypasses TCC Accessibility)
  # -----------------------------------------------------------------------
  macos-e2e:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # The Karabiner Driver Kit extension requires a one-time user approval
      # that a headless runner cannot give. So, the e2e tests cannot run in
      # this workflow.

      - name: Run CLI integration tests
        # The CLI integration tests need no input device and no root access.
        run: |
          cargo build --bin keymapper
          cargo nextest run --test keymapper_tests

  # -----------------------------------------------------------------------
  # Windows — e2e sandbox tests (no elevation required)
  # -----------------------------------------------------------------------
  windows-e2e:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Build daemon and e2e test binary
        # The e2e harness spawns keymapperd and keymapper_reader as
        # subprocesses and resolves each from target/debug/ relative to the
        # test binary's location.
        run: |
          cargo build --bin keymapperd --bin keymapper_reader
          cargo nextest run --test e2e_tests --no-run

      - name: Run e2e tests
        # SendInput and WH_KEYBOARD_LL work at session level; no elevation
        # is required.  The runner has a desktop session, so the harness can
        # bring the reader's console window to the foreground.
        run: cargo nextest run --no-capture --test e2e_tests

      - name: Run CLI integration tests
        # The CLI integration tests need no root access or input device.
        run: |
          cargo build --bin keymapper
          cargo nextest run --test keymapper_tests
