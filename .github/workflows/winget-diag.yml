# ---------------------------------------------------------------------------
# name:     winget-diag (temporary)
# triggers: workflow_dispatch only
#
# Diagnostic probes for the winget-pkgs contents API 404 on windows-latest.
# Tests several URL formulations and prints the exact request gh sends
# (GH_DEBUG) so the failing variant can be identified. Delete after use.
# ---------------------------------------------------------------------------

name: winget-diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - name: Probe contents API formulations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh --version
          $PSVersionTable.PSVersion.ToString()
          $repo = "mamrhein/keymapper.rs"
          $file = "winget/adrhinum.keymapper.yaml"

          function Probe {
            param([string]$Label, [scriptblock]$Script)
            $out = & $Script 2>&1
            $code = $LASTEXITCODE
            $first = ($out | Select-Object -First 1)
            Write-Host "[$Label] exit=$code out=$first"
          }

          Probe "tag-ref"           { gh api "repos/$repo/git/refs/tags/v0.2.5" --jq '.object.sha' }
          Probe "dir-listing"       { gh api "repos/$repo/contents/winget?ref=v0.2.5" --jq 'length' }
          Probe "file-tag-quoted"   { gh api "repos/$repo/contents/$file?ref=v0.2.5" --jq '.name' }
          Probe "file-tag-unquoted" { gh api repos/$repo/contents/$file?ref=v0.2.5 --jq '.name' }
          Probe "file-sha"          { gh api "repos/$repo/contents/$file?ref=b57276745e39fb4e9058591a2d5f4bd75645d673" --jq '.name' }
          Probe "file-noref"        { gh api "repos/$repo/contents/$file" --jq '.name' }

          # The exact command shape from the failing workflow.
          $env:VERSION = "0.2.5"
          foreach ($name in @("adrhinum.keymapper.yaml")) {
            $content = gh api "repos/$repo/contents/winget/$name?ref=v$env:VERSION" --jq '.content'
            $len = if ($content) { $content.Length } else { 0 }
            Write-Host "[exact-shape] exit=$LASTEXITCODE len=$len"
          }

          # Show the exact request gh sends for the failing formulation.
          Write-Host "--- GH_DEBUG: file-tag-quoted ---"
          $env:GH_DEBUG = "1"
          gh api "repos/$repo/contents/$file?ref=v0.2.5" --jq '.name' 2>&1 | Select-Object -First 12
          Remove-Item Env:GH_DEBUG
