# ---------------------------------------------------------------------------
# name:     homebrew-tap
# triggers: version tags (v*)
#
# After the release workflow finishes, this job opens a pull request against
# the Homebrew tap to update the formula (source build) and the cask
# (precompiled binaries) with the new version, archive URLs, and checksums.
# No notarization step is required — ad-hoc signing is sufficient for local
# driver installation.
# ---------------------------------------------------------------------------

name: homebrew-tap

on:
  workflow_dispatch:

  workflow_run:
    workflows: ["release"]
    types:
      - completed

env:
  HOMEBREW_TAP_OWNER: mamrhein
  HOMEBREW_TAP_REPO: homebrew-keymapper

permissions:
  contents: read
  pull-requests: write

jobs:
  # -----------------------------------------------------------------------
  # Update the Homebrew formula when the release workflow succeeds
  # -----------------------------------------------------------------------
  update-tap:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-latest

    steps:
      # Fail early with an actionable message if the secret is missing; a
      # missing secret would otherwise surface as "Input required and not
      # supplied: token" from actions/checkout.
      - name: Verify tap token is configured
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo "Error: the HOMEBREW_TAP_TOKEN secret is not set." >&2
            echo "Create a token with write access to ${{ env.HOMEBREW_TAP_OWNER }}/${{ env.HOMEBREW_TAP_REPO }} and add it as a repository secret." >&2
            exit 1
          fi

      - name: Checkout formula repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.HOMEBREW_TAP_OWNER }}/${{ env.HOMEBREW_TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Determine version
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract the tag name from the triggering workflow run
          TAG=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }} \
            --jq '.head_branch')
          if [[ "$TAG" != v* ]]; then
            echo "Not a version tag ($TAG), skipping." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update formula and cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"

          # A failed fetch piped into `base64 -d` would otherwise be masked
          # by the successful decode of empty input.
          set -o pipefail

          mkdir -p Formula Casks

          # GitHub's git data APIs are eventually consistent right after a
          # tag push: the ref may not be visible yet, a re-pushed tag may be
          # briefly absent, and the contents API can 404 for a ref that
          # already resolves. Retry to ride out the inconsistency window.
          gh_api_with_retry() {
            local path="$1" filter="${2:-.}" attempt output
            for ((attempt = 1; attempt <= 10; attempt++)); do
              if output=$(gh api "$path" --jq "$filter" 2>&1); then
                printf '%s\n' "$output"
                return 0
              fi
              if ((attempt == 10)); then
                echo "gh api $path failed after 10 attempts: $output" >&2
                return 1
              fi
              sleep 30
            done
          }

          # Sync the formula from the keymapper repository at the release tag.
          # The repo is the source of truth for the formula body, so re-seed it
          # on every release (not just the first) to keep structural changes in
          # the tap, then update the version and url below.
          gh_api_with_retry "repos/${{ github.repository }}/contents/brew/keymapper.rb?ref=v${VERSION}" '.content' \
            | base64 -d > "Formula/keymapper.rb"

          # Update version and url in the formula
          sed -i '' \
            -e "s/version \".*\"/version \"${VERSION}\"/" \
            -e "s|url \".*/v[^\"]*\"|url \"https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.tar.gz\"|" \
            "Formula/keymapper.rb"

          # Sync the cask from the keymapper repository at the release tag.
          gh_api_with_retry "repos/${{ github.repository }}/contents/brew/keymapper-bin.rb?ref=v${VERSION}" '.content' \
            | base64 -d > "Casks/keymapper-bin.rb"

          # Download the macOS release archives and compute their checksums.
          gh release download "v${VERSION}" --repo "${{ github.repository }}" \
            -p "keymapper-v${VERSION}-aarch64-apple-darwin.tar.xz" -O keymapper-arm.tar.xz
          gh release download "v${VERSION}" --repo "${{ github.repository }}" \
            -p "keymapper-v${VERSION}-x86_64-apple-darwin.tar.xz" -O keymapper-intel.tar.xz
          ARM_SHA=$(shasum -a 256 keymapper-arm.tar.xz | awk '{print $1}')
          INTEL_SHA=$(shasum -a 256 keymapper-intel.tar.xz | awk '{print $1}')

          # Update version and per-architecture checksums in the cask (the url
          # interpolates the version, so it needs no update).
          sed -i '' \
            -e "s/version \".*\"/version \"${VERSION}\"/" \
            -e "s|sha256 arm:   \"[0-9a-f]\{64\}\"|sha256 arm:   \"${ARM_SHA}\"|" \
            -e "s|intel: \"[0-9a-f]\{64\}\"|intel: \"${INTEL_SHA}\"|" \
            "Casks/keymapper-bin.rb"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          BRANCH="update-to-${VERSION}"
          git checkout -b "$BRANCH"
          git add Formula/keymapper.rb Casks/keymapper-bin.rb
          git diff --cached --quiet || git commit -m "chore: update to version ${VERSION}"
          git push origin "$BRANCH" --force-with-lease
          gh pr create \
            --title "chore: update to version ${VERSION}" \
            --body "Automated pull request to update the Homebrew formula and cask for keymapper ${VERSION}." \
            --base main \
            --head "$BRANCH"
