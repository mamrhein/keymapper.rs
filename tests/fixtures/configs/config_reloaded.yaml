# Reloaded config for hot-reload e2e testing.
#
# Replaces the comprehensive config.  Different global mappings verify that
# the daemon picks up the new rules after a file change.  Global rules only:
# the e2e harness (first iteration) cannot control which app is active.

- name: "global mappings (reloaded)"
  mappings:
    RightControl: Escape
    A: C
    Escape: Cmd+T
