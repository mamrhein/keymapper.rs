[package]
name = "keymapper"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Michael Amrhein <michael@adrhinum.de>"]
description = "Cross-platform key-remapping daemon and cli utility for macOS, Linux, and Windows"
readme = "README.md"
homepage = "https://github.com/mamrhein/keymapper.rs"
repository = "https://github.com/mamrhein/keymapper.rs"
license-file = "LICENSE.TXT"
keywords = ["Cross-platform", "keymapper", "macOS", "Linux", "Windows"]
categories = ["command-line-utilities"]

[[bin]]
name = "keymapper"
path = "src/keymapper.rs"

[[bin]]
name = "keymapperd"
path = "src/keymapperd.rs"

[[bin]]
name = "keymapper_monitor"
path = "src/keymapper_monitor.rs"

[dependencies]
clap = { version = "4", features = ["derive"]}
dirs = "6" # platform config directory resolution
fs-err = "3"
indexmap = { version = "2", features = ["serde"] }
notify = "8" # cross-platform file watching
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Unix signal handling and libc bindings
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

# Linux-specific kernel input bindings
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
nix = { version = "0.31.3", features = ["event"] }
sysinfo = "0.39" # process enumeration for `keymapper appnames`
udev = "0.9"
wayland-client = "0.31"
x11rb = { version = "0.14", features = ["allow-unsafe-code"] }
zbus = { version = "5", features = ["blocking"] }

# macOS framework bindings
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop", "CFString", "CFNumber", "CFDictionary"] }
objc2-core-graphics = { version = "0.3", features = ["CGWindow"] }
objc2-foundation = "0.3"

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
crossbeam-channel = "0.5" # lock-free IPC between input threads
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
] }

[dev-dependencies]
tempfile = "3" # unique, auto-removed temp files for tests
