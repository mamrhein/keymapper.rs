[package]
name = "keymapper"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Michael Amrhein <michael@adrhinum.de>"]
description = "Cross-platform key-remapping daemon and cli utility for macOS, Linux, and Windows"
readme = "README.md"
homepage = "https://github.com/mamrhein/keymapper.rs"
repository = "https://github.com/mamrhein/keymapper.rs"
license-file = "LICENSE.TXT"
keywords = ["Cross-platform", "keymapper", "macOS", "Linux", "Windows"]
categories = ["command-line-utilities"]

[[bin]]
name = "keymapper"
path = "src/keymapper.rs"

[[bin]]
name = "keymapperd"
path = "src/keymapperd.rs"

[dependencies]
dirs = "6" # platform config directory resolution
indexmap = { version = "2", features = ["serde"] }
notify = "8" # cross-platform file watching
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"]}
fs-err = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

# Linux-specific kernel input bindings
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

udev = "0.9"
nix = { version = "0.31.3", features = ["event"] }
sysinfo = "0.39" # process enumeration for `keymapper appnames`
x11rb = { version = "0.14", features = ["allow-unsafe-code"], optional = true }
wayland-client = { version = "0.31", optional = true }
cosmic-client-toolkit = { version = "0.2", optional = true }
zbus = { version = "5", features = ["blocking"], optional = true }

# macOS framework bindings
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWorkspace"] }
objc2-core-graphics = { version = "0.3", features = ["CGWindow"] }
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop", "CFString", "CFNumber", "CFDictionary"] }

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
crossbeam-channel = "0.5" # lock-free IPC between input threads
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
] }

[features]
default = ["wayland"]
x11 = ["dep:x11rb"]
wayland = ["dep:wayland-client", "dep:cosmic-client-toolkit", "dep:zbus"]

# Enable the DriverKit-based virtual HID keyboard on macOS.  When active,
# synthetic key events are emitted through a real hardware-level HID device
# instead of CGEvent, bypassing the synthetic-event restrictions of modern
# macOS.  Requires the KeyMapperDriver extension to be loaded.
driverkit = []
