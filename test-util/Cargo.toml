[package]
name = "test-util"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Test helpers (key injector) for the keymapper e2e test harness; dev-only, never linked into release binaries."
publish = false

[dependencies]
# The `test-util` feature un-gates the test-harness-only public surface this
# crate consumes (`KarabinerClient`, `INJECTION_KEYBOARD_IDENTITY`, `Key`).
# Enabling it here also turns the feature on for the root package's integration
# tests (which depend on `test-util`) during a test build.
keymapper = { path = "..", features = ["test-util"] }

# Linux-specific kernel input bindings
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
libc = "0.2"

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse"] }
